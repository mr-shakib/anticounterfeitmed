[project]
name = "medcrypto"
version = "0.1.0"
description = "Shared canonicalisation, tokens and ML-DSA signing for the medicine verification platform."
requires-python = ">=3.12"
dependencies = ["cryptography>=50,<51", "rfc8785==0.1.4"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["medcrypto*"]
