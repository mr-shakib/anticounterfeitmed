# nginx configuration for the public landing page.
#
# This page is the one that a scanned QR reaches with a package token in the URL
# fragment. The rules below exist so that token cannot leak:
#
#   * connect-src 'none' means the page cannot call any API, including ours.
#   * default-src 'none' means nothing loads unless listed explicitly.
#   * script-src is pinned to the SHA-256 of the one inline script, so adding
#     any script -- analytics, a tag manager, an error reporter -- breaks the
#     page loudly instead of silently reading the token.
#   * Referrer-Policy: no-referrer stops the URL travelling in a Referer header.
#
# Regenerate the hashes with: make landing-csp

server {
    listen 443 ssl http2;
    server_name anticounterfeitmed.com;

    # ssl_certificate     /etc/letsencrypt/live/anticounterfeitmed.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/anticounterfeitmed.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /srv/landing;
    index index.html;

    # Serve directly at /. Never redirect: a redirect can carry the fragment
    # somewhere it should not go, and the SRS forbids relying on one.
    location = / {
        try_files /index.html =404;

        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-zMkY2w4HVZpa767sqRJ459OBVAZ/JcAhMICXtUs4ick='; style-src 'sha256-sXJXXy3Cq2RmSqGZbqQi/P5VGdi72UgNvhQAHF9tr58='; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; connect-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # The landing page has no API surface. Refuse anything that looks like one,
    # so a misconfiguration can never expose verification from this origin.
    location /v1/ { return 404; }

    location / {
        try_files $uri $uri/ =404;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
