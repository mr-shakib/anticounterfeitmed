# Production nginx for anticounterfeitmed.com.
#
# One origin serves two very different things, and the split matters:
#
#   /      the static landing page, which is what a phone camera reaches with a
#          package token in the URL fragment. It gets the strict headers below.
#   /v1/   the API, which only the official app calls.
#
# Sharing an origin is safe because the control that stops the page touching the
# API is the page's own CSP: connect-src 'none' means the landing page cannot
# make a request to anything, including us. A path rule would not add to that,
# and would break the app.
#
# Regenerate the CSP hashes after editing the page with: make landing-csp

upstream acm_api {
    server api:8000;
}

server {
    listen 80;
    server_name anticounterfeitmed.com;
    # ACME challenges stay on port 80; everything else is redirected.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name anticounterfeitmed.com;

    ssl_certificate     /etc/letsencrypt/live/anticounterfeitmed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/anticounterfeitmed.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    root /srv/landing;
    index index.html;

    # Serve directly at /. Never redirect: a redirect can carry the fragment
    # somewhere it should not go, and the SRS forbids relying on one.
    location = / {
        try_files /index.html =404;

        add_header Content-Security-Policy "default-src 'none'; script-src 'sha256-zMkY2w4HVZpa767sqRJ459OBVAZ/JcAhMICXtUs4ick='; style-src 'sha256-sXJXXy3Cq2RmSqGZbqQi/P5VGdi72UgNvhQAHF9tr58='; img-src 'self' data:; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; connect-src 'none'" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), interest-cohort=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Cache-Control "public, max-age=300" always;
    }

    # The API. Only the official app calls this; the landing page cannot,
    # because its own CSP forbids every outbound connection.
    location /v1/ {
        proxy_pass http://acm_api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri $uri/ =404;
        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
