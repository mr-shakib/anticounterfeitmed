# The deployed form of pqc-hub.conf, as it stands after certbot added TLS.
# Kept for reference so the live arrangement is visible in the repository;
# pqc-hub.conf remains the HTTP-only version certbot bootstraps from.
# pqc.anticounterfeitmed.com — the project's entry point.
#
# One origin carries three things:
#
#   /        a static hub, from which someone chooses where they are going
#   /staff   the staff portal
#   /v1      the API
#
# The API is deliberately reachable here as well as on api.pqc. The portal
# authenticates with a session cookie, and serving it from the same origin as
# the API it calls keeps that cookie first-party, with no CORS to configure.
# The mobile app uses api.pqc instead, where no cookie is involved.
#
# HTTP only as shipped: `certbot --nginx` runs `nginx -t` before doing anything,
# so naming a certificate that does not exist yet stops it from ever creating
# one. Certbot clones this block to 443 and adds the certificate itself.
#
#   sudo cp pqc-hub.conf /etc/nginx/sites-available/acm-hub
#   sudo ln -s /etc/nginx/sites-available/acm-hub /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d pqc.anticounterfeitmed.com

server {
    server_name pqc.anticounterfeitmed.com;

    # Signed responses carry two ML-DSA signatures and reach about 11 KB, so the
    # default proxy buffers are worth raising rather than spilling to disk.
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    # The staff portal.
    location /staff {
        proxy_pass http://127.0.0.1:3100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # The API, same origin as the portal that calls it.
    location /v1/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
    # The hub, the app install page and the app build. Proxied rather than read
    # from disk: nginx cannot traverse into a user's home directory, and this
    # keeps updates to a container rebuild instead of a privileged file copy.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # The app build is large; stream it rather than spooling to a temp file.
        proxy_max_temp_file_size 0;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/pqc.anticounterfeitmed.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/pqc.anticounterfeitmed.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = pqc.anticounterfeitmed.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name pqc.anticounterfeitmed.com;
    return 404; # managed by Certbot


}