# Server block for the verification API, to add to a host's existing nginx.
#
# HTTP only on purpose. `certbot --nginx` runs `nginx -t` before it does
# anything, so a config that names a certificate which does not exist yet stops
# certbot from ever creating it. Certbot clones this block to port 443, adds the
# certificate lines, and the proxy settings below carry over with it.
#
# Deliberately a separate subdomain. The site at the domain root keeps working
# untouched, and decision D17 -- what serves "/" once QR codes are printed --
# stays open rather than being settled by a deployment.
#
#   sudo cp api-subdomain.conf /etc/nginx/sites-available/acm-api
#   sudo ln -s /etc/nginx/sites-available/acm-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d api.pqc.anticounterfeitmed.com

server {
    listen 80;
    listen [::]:80;
    server_name api.pqc.anticounterfeitmed.com;

    # Signed responses carry two ML-DSA signatures and run to about 11 KB, so
    # the default buffers are worth raising rather than spilling to disk.
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
}
