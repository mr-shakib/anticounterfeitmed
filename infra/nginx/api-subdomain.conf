# Server block for the verification API, to add to a host's existing nginx.
#
# Deliberately a separate subdomain. The site at the domain root keeps working
# untouched, and decision D17 -- what serves "/" once QR codes are printed --
# stays open rather than being settled by a deployment.
#
# The consumer app reaches this host through BACKEND_BASE_URL; the printed QR
# still points at the root domain, so the two are independent.
#
#   sudo cp api-subdomain.conf /etc/nginx/sites-available/acm-api
#   sudo ln -s /etc/nginx/sites-available/acm-api /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name api.pqc.anticounterfeitmed.com;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pqc.anticounterfeitmed.com;

    ssl_certificate     /etc/letsencrypt/live/api.pqc.anticounterfeitmed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pqc.anticounterfeitmed.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # Signed responses carry two ML-DSA signatures and run to about 11 KB, so
    # the default buffers are worth raising rather than spilling to disk.
    proxy_buffers 16 16k;
    proxy_buffer_size 32k;

    location / {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;

        add_header Referrer-Policy "no-referrer" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "no-store" always;
    }
}
