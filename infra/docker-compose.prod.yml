# Pilot deployment.
#
# The shape that matters here is the network split. Everything the internet can
# reach sits on "edge"; the signing service sits only on "internal", with no
# published port and no route in from outside. A compromised web process can ask
# it for a signature, which is audited, but cannot reach the key material.
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backups:/backups
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      retries: 10
    # Continuous archiving for point-in-time recovery. A restore drill is an
    # acceptance test, not an optional extra: see docs/11.
    command: >
      postgres
      -c max_connections=300
      -c wal_level=replica
      -c archive_mode=on
      -c archive_command='test ! -f /backups/wal/%f && cp %p /backups/wal/%f'

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [internal]

  signer:
    build:
      context: ..
      dockerfile: signer/Dockerfile
    restart: unless-stopped
    # No ports. No database credentials. Internal network only.
    networks: [internal]
    volumes:
      # A named volume, not a bind mount into the source tree. Two reasons:
      # Docker owns the permissions, so the service can write the keys it
      # generates; and a deploy that syncs source cannot delete it. Private
      # seeds must not live anywhere a routine file copy can reach.
      - signer_keys:/keys
    environment:
      SIGNER_KEYSTORE_PATH: /keys
      # Reaching the port is not the same as being allowed to sign.
      SIGNER_AUTH_TOKEN: ${SIGNER_AUTH_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:9000/healthz')\""]
      interval: 30s
      retries: 3

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal, edge]
    expose: ["8000"]

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    command: celery -A config worker -l info

  beat:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file: .env
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    command: celery -A config beat -l info

  hub:
    build:
      context: ..
      dockerfile: hub/Dockerfile
    restart: unless-stopped
    networks: [edge]
    expose: ["8080"]

  portal:
    build:
      context: ..
      dockerfile: staff-web/Dockerfile
      args:
        PORTAL_BASE_PATH: ${PORTAL_BASE_PATH:-/staff}
    restart: unless-stopped
    environment:
      # Server-side rewrites reach the API over the private network; the
      # browser reaches it same-origin through the host's nginx.
      BACKEND_ORIGIN: http://api:8000
    depends_on: [api]
    networks: [internal, edge]
    expose: ["3000"]

  proxy:
    image: nginx:alpine
    restart: unless-stopped
    depends_on: [api]
    networks: [edge]
    ports: ["80:80", "443:443"]
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ../landing:/srv/landing:ro
      - ./certs:/etc/letsencrypt:ro

volumes:
  pgdata:
  # Holds the ML-DSA private seeds. Back this up separately and verify the
  # restore: a lost signing key cannot be recreated, and every credential it
  # signed becomes unverifiable.
  signer_keys:

networks:
  edge:
  internal:
    internal: true
